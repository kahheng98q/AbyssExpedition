<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VD-01 · 真实时钟动作记录</title><style>
:root{color-scheme:dark;--ink:#0b1018;--panel:#191e2e;--line:#344757;--text:#e9e6d8;--mint:#a5f3e8;--gold:#d6ae68}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1340px;margin:auto;padding:28px 24px}a{color:var(--mint)}h1{font-size:clamp(24px,4vw,38px);margin:12px 0}p{color:#aebdca;max-width:850px}.tag{display:inline-block;border:1px solid var(--line);color:var(--gold);padding:3px 10px;font-size:12px}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:24px 0}label{display:grid;gap:5px;font-size:12px;color:#aebdca}select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px;font:inherit;min-height:44px}button{cursor:pointer;color:var(--mint)}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.stage{overflow:auto;border:1px solid var(--line);background:#080b10;max-width:100%;padding:12px}.board{width:1280px;max-width:none}img{display:block;width:100%;image-rendering:pixelated;aspect-ratio:16/9}#status{min-height:28px;color:var(--mint);font-variant-numeric:tabular-nums}details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#aebdca;font-size:12px}.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px}
</style></head><body><main><span class="tag">REAL · CONTROLLED / ELAPSED CLOCK</span><h1>动作按真实间隔播放。</h1><p>运行中的 Godot 视口逐帧保存，并记录实际经过时间。包含自动战斗、走位和暂停；“controlled”片段单独注入观察角色状态。非物理显示录像，不用于判定输入延迟或人工识别成绩。</p><div class="tools"><label>构建<select id="build"></select></label><label>片段<select id="segment"></select></label><label>整数倍率<select id="scale"><option value="1">1×</option><option selected value="2">2×</option><option value="3">3×</option></select></label><button id="play">播放</button></div><div class="stage" tabindex="0" aria-label="可横向滚动的原生像素画面"><div class="board" id="board"><img id="frame" alt="REAL：运行中的Godot视口，尚未播放"></div></div><p id="status" role="status">加载本地记录…</p><details><summary>时间、状态和版本记录</summary><pre id="metadata"></pre></details><div class="links"><a href="runtime-gallery.html">静帧对照与识别片段</a><a href="../validation/visual-vd01/completion-r1.md">本轮修复与剩余验收</a><a href="preview.html">视觉预览</a></div></main><script src="wallclock-data.js"></script><script src="wallclock-gallery.js"></script></body></html>
